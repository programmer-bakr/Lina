<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لينا | Lina - مترجم ملفات PDF مع الحفاظ على التصميم</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- مكتبة قراءة ورسم ملفات PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- مكتبة إنشاء ملف PDF النهائي -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg-main: #fdf8fa;
            --primary: #d946ef;
            --text-dark: #1e1b4b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(244, 63, 94, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(217, 70, 239, 0.1) 0px, transparent 50%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav {
            width: 100%;
            max-width: 900px;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #db2777, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            background: linear-gradient(135deg, #fce7f3, #f3e8ff);
            color: #be185d;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid #fbcfe8;
        }

        .hero {
            text-align: center;
            max-width: 650px;
            padding: 10px 20px 25px;
        }

        .hero h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .hero h1 span {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .workspace {
            background: #ffffff;
            width: 92%;
            max-width: 820px;
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(219, 39, 119, 0.08);
            border: 1px solid #fce7f3;
            margin-bottom: 40px;
        }

        .upload-box {
            border: 2px dashed #f472b6;
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            background: linear-gradient(180deg, #fff 0%, #fdf2f8 100%);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .upload-box:hover {
            border-color: #9333ea;
            transform: translateY(-2px);
        }

        .icon-circle {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #ec4899, #a855f7);
            color: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.3);
        }

        .upload-btn-text {
            background: white;
            color: #db2777;
            padding: 10px 24px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(219, 39, 119, 0.1);
            border: 1px solid #fbcfe8;
        }

        input[type="file"] {
            display: none;
        }

        .progress-area {
            display: none;
            padding: 20px 0;
            text-align: center;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            color: #be185d;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .progress-track {
            width: 100%;
            height: 12px;
            background: #fce7f3;
            border-radius: 50px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ec4899, #9333ea);
            border-radius: 50px;
            transition: width 0.3s ease;
        }

        .action-bar {
            display: none;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 14px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-download {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: white;
            box-shadow: 0 8px 20px rgba(219, 39, 119, 0.3);
        }

        .btn-reset {
            background: #fdf2f8;
            color: #be185d;
            border: 1px solid #fbcfe8;
        }

        /* معاينة الصفحات المترجمة بنفس التصميم */
        .preview-container {
            display: none;
            margin-top: 25px;
            border-top: 2px solid #fdf2f8;
            padding-top: 20px;
            text-align: center;
        }

        #pagesWrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            max-height: 600px;
            overflow-y: auto;
            padding: 15px;
            background: #f8fafc;
            border-radius: 18px;
            border: 1px solid #f3e8ff;
        }

        .rendered-page-canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            border: 1px solid #e2e8f0;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <nav>
        <div class="brand">لينا 👑</div>
        <div class="badge">يحافظ على تصميم الملف ✨</div>
    </nav>

    <section class="hero">
        <h1>ترجمي ملفاتك مع <span>لينا</span> بنفس التصميم الأصلي</h1>
        <p>ارفعي ملف الـ PDF، وسأحافظ على نفس الصفحات والصور والألوان وأضع الترجمة العربية تحت كل سطر في مكانه!</p>
    </section>

    <main class="workspace">
        <label for="fileInput" class="upload-box" id="dropZone">
            <div class="icon-circle">📄</div>
            <h3>اختاري ملف الـ PDF لترجمته</h3>
            <p style="color: #64748b; font-size: 0.85rem; margin-top: 4px;">سيبقى تصميم الملف كما هو مع إضافة الترجمة أسفل كل سطر</p>
            <div class="upload-btn-text">اختيار ملف PDF ✨</div>
        </label>
        <input type="file" id="fileInput" accept=".pdf">

        <div class="progress-area" id="progressArea">
            <div class="progress-header">
                <span id="statusLabel">جاري تجهيز الصفحات...</span>
                <span id="percentLabel">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="action-bar" id="actionBar">
            <button class="btn btn-download" onclick="exportFinalPDF()">✨ تحميل الملف المترجم بنفس التصميم (PDF)</button>
            <button class="btn btn-reset" onclick="resetPage()">🔄 ترجمة ملف آخر</button>
        </div>

        <div class="preview-container" id="previewContainer">
            <h4 style="margin-bottom: 15px; color: #1e1b4b;">📖 معاينة الصفحات بعد الترجمة:</h4>
            <div id="pagesWrapper"></div>
        </div>
    </main>

    <footer>
        صُمم بكل حب وأناقة • منصة لينا للترجمة الذكية 🌸
    </footer>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const progressArea = document.getElementById('progressArea');
        const progressFill = document.getElementById('progressFill');
        const statusLabel = document.getElementById('statusLabel');
        const percentLabel = document.getElementById('percentLabel');
        const actionBar = document.getElementById('actionBar');
        const previewContainer = document.getElementById('previewContainer');
        const pagesWrapper = document.getElementById('pagesWrapper');

        let savedFileName = "Lina_Translated";
        let renderedCanvases = [];

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) processPDFWithLayout(e.target.files[0]);
        });

        async function processPDFWithLayout(file) {
            if (file.type !== "application/pdf") {
                alert("يرجى اختيار ملف بصيغة PDF فقط.");
                return;
            }

            savedFileName = file.name.replace('.pdf', '') + "_مترجم_لينا";
            dropZone.style.display = 'none';
            progressArea.style.display = 'block';
            pagesWrapper.innerHTML = '';
            renderedCanvases = [];
            setProgress(5, "جاري تحميل صفحات الملف...");

            const reader = new FileReader();
            reader.readAsArrayBuffer(file);

            reader.onload = async function() {
                try {
                    const typedarray = new Uint8Array(this.result);
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    const totalPages = pdf.numPages;

                    previewContainer.style.display = 'block';

                    for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                        setProgress(
                            Math.round(((pageNum - 1) / totalPages) * 100),
                            `جاري رسم وترجمة الصفحة ${pageNum} من ${totalPages}...`
                        );

                        const page = await pdf.getPage(pageNum);
                        // دقة عالية للحفاظ على وضوح التصميم الأصلي
                        const scale = 2.0; 
                        const viewport = page.getViewport({ scale: scale });

                        // إنشاء لوحة رسم (Canvas) للصفحة
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        canvas.className = 'rendered-page-canvas';

                        // 1. رسم الصفحة الأصلية بكل تفاصيلها وصورها وتصميمها
                        await page.render({
                            canvasContext: context,
                            viewport: viewport
                        }).promise;

                        // 2. استخراج مواقع النصوص في الصفحة
                        const textContent = await page.getTextContent();
                        let linesMap = [];

                        textContent.items.forEach(item => {
                            const str = item.str.trim();
                            if (!str) return;

                            // تحويل إحداثيات الـ PDF إلى إحداثيات اللوحة (Canvas)
                            const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
                            const x = tx[4];
                            const y = tx[5];
                            const fontHeight = Math.hypot(tx[2], tx[3]);

                            // تجميع الكلمات التي تقع على نفس السطر الأفقي
                            let existingLine = linesMap.find(l => Math.abs(l.y - y) < (fontHeight * 0.6));
                            if (existingLine) {
                                existingLine.text += " " + str;
                                existingLine.minX = Math.min(existingLine.minX, x);
                                existingLine.maxX = Math.max(existingLine.maxX, x + (item.width * scale));
                            } else {
                                linesMap.push({
                                    text: str,
                                    y: y,
                                    minX: x,
                                    maxX: x + (item.width * scale),
                                    fontSize: fontHeight
                                });
                            }
                        });

                        // 3. ترجمة كل سطر وطباعته أسفل السطر الإنجليزي مباشرة
                        for (let i = 0; i < linesMap.length; i++) {
                            const lineObj = linesMap[i];
                            // تجاهل الرموز والأرقام المنفردة
                            if (lineObj.text.length < 2 || /^[0-9\W]+$/.test(lineObj.text)) continue;

                            const arText = await getArabicTranslation(lineObj.text);
                            if (!arText) continue;

                            // ضبط حجم الخط العربي ليتناسب مع مساحة السطر
                            const arFontSize = Math.max(12, Math.min(lineObj.fontSize * 0.85, 22));
                            context.font = `bold ${arFontSize}px 'Cairo', sans-serif`;
                            
                            const textMetrics = context.measureText(arText);
                            const arWidth = textMetrics.width;
                            const arY = lineObj.y + arFontSize + 4; // أسفل السطر الإنجليزي مباشرة

                            // محاذاة النص العربي لليمين عند نهاية السطر الإنجليزي
                            const drawX = Math.min(canvas.width - 20, Math.max(lineObj.maxX, lineObj.minX + arWidth));

                            // رسم شريط خلفية أبيض ناعم خلف الترجمة لكي لا تتداخل مع خلفية الصفحة
                            context.fillStyle = "rgba(255, 255, 255, 0.88)";
                            context.fillRect(drawX - arWidth - 6, arY - arFontSize + 2, arWidth + 12, arFontSize + 5);

                            // كتابة الترجمة العربية بلون واضح وأنيق
                            context.fillStyle = "#be185d";
                            context.textAlign = "right";
                            context.direction = "rtl";
                            context.fillText(arText, drawX, arY);
                        }

                        pagesWrapper.appendChild(canvas);
                        renderedCanvases.push(canvas);
                    }

                    setProgress(100, "✨ اكتملت ترجمة جميع الصفحات بنفس التصميم!");
                    actionBar.style.display = 'flex';

                } catch (err) {
                    console.error(err);
                    setProgress(0, "حدث خطأ أثناء معالجة الملف.");
                }
            };
        }

        function setProgress(pct, msg) {
            progressFill.style.width = pct + '%';
            percentLabel.innerText = pct + '%';
            statusLabel.innerText = msg;
        }

        async function getArabicTranslation(text) {
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ar&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                const data = await res.json();
                return data[0].map(item => item[0]).join('');
            } catch {
                return "";
            }
        }

        function exportFinalPDF() {
            if (renderedCanvases.length === 0) return;
            statusLabel.innerText = "جاري حفظ ملف الـ PDF النهائي... 👑";

            const { jsPDF } = window.jspdf;
            const firstCanvas = renderedCanvases[0];
            const orientation = firstCanvas.width > firstCanvas.height ? 'l' : 'p';
            
            const pdf = new jsPDF({
                orientation: orientation,
                unit: 'px',
                format: [firstCanvas.width, firstCanvas.height]
            });

            renderedCanvases.forEach((canvas, index) => {
                if (index > 0) {
                    const pageOrientation = canvas.width > canvas.height ? 'l' : 'p';
                    pdf.addPage([canvas.width, canvas.height], pageOrientation);
                }
                const imgData = canvas.toDataURL('image/jpeg', 0.92);
                pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
            });

            pdf.save(savedFileName + '.pdf');
            statusLabel.innerText = "✨ تم تحميل الملف المترجم بنفس التصميم!";
        }

        function resetPage() {
            fileInput.value = '';
            dropZone.style.display = 'flex';
            progressArea.style.display = 'none';
            actionBar.style.display = 'none';
            previewContainer.style.display = 'none';
            pagesWrapper.innerHTML = '';
            renderedCanvases = [];
        }
    </script>
</body>
</html>
