<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لينا | Lina - مترجم ملفات PDF السريع والآمن</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg-main: #fdf8fa;
            --primary: #d946ef;
            --text-dark: #1e1b4b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(244, 63, 94, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(217, 70, 239, 0.1) 0px, transparent 50%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 30px;
        }

        nav {
            width: 100%;
            max-width: 900px;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #db2777, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            background: linear-gradient(135deg, #fce7f3, #f3e8ff);
            color: #be185d;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid #fbcfe8;
        }

        .hero {
            text-align: center;
            max-width: 650px;
            padding: 10px 20px 25px;
        }

        .hero h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .hero h1 span {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .workspace {
            background: #ffffff;
            width: 92%;
            max-width: 820px;
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(219, 39, 119, 0.08);
            border: 1px solid #fce7f3;
        }

        .upload-box {
            border: 2px dashed #f472b6;
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            background: linear-gradient(180deg, #fff 0%, #fdf2f8 100%);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .upload-box:hover {
            border-color: #9333ea;
            transform: translateY(-2px);
        }

        .icon-circle {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #ec4899, #a855f7);
            color: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.3);
        }

        .upload-btn-text {
            background: white;
            color: #db2777;
            padding: 10px 24px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(219, 39, 119, 0.1);
            border: 1px solid #fbcfe8;
        }

        input[type="file"] {
            display: none;
        }

        .progress-area {
            display: none;
            padding: 20px 0;
            text-align: center;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            color: #be185d;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .progress-track {
            width: 100%;
            height: 12px;
            background: #fce7f3;
            border-radius: 50px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ec4899, #9333ea);
            border-radius: 50px;
            transition: width 0.3s ease;
        }

        .action-bar {
            display: none;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 14px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-download {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: white;
            box-shadow: 0 8px 20px rgba(219, 39, 119, 0.3);
        }

        .btn-reset {
            background: #fdf2f8;
            color: #be185d;
            border: 1px solid #fbcfe8;
        }

        .preview-container {
            display: none;
            margin-top: 25px;
            border-top: 2px solid #fdf2f8;
            padding-top: 20px;
        }

        #pdfContent {
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #f3e8ff;
            max-height: 480px;
            overflow-y: auto;
        }

        .doc-title {
            text-align: center;
            color: #db2777;
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #fce7f3;
        }

        .pair-box {
            background: #fffdfd;
            border: 1px solid #f3e8ff;
            border-right: 4px solid #db2777;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }

        .en-txt {
            direction: ltr;
            text-align: left;
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .ar-txt {
            direction: rtl;
            text-align: right;
            font-size: 14px;
            font-weight: 700;
            color: #be185d;
            background: #fdf2f8;
            padding: 6px 10px;
            border-radius: 8px;
        }

        footer {
            margin-top: 30px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>

    <nav>
        <div class="brand">لينا 👑</div>
        <div class="badge">سريع ومستقر ✨</div>
    </nav>

    <section class="hero">
        <h1>مترجم ملفات PDF الذكي مع <span>لينا</span></h1>
        <p>ارفعي ملفك وسيعمل بسلاسة تامة لإعطائك ترجمة دقيقة ومنظمة!</p>
    </section>

    <main class="workspace">
        <label for="fileInput" class="upload-box" id="dropZone">
            <div class="icon-circle">📄</div>
            <h3>اضغطي هنا لاختيار ملف الـ PDF</h3>
            <p style="color: #64748b; font-size: 0.85rem; margin-top: 4px;">يدعم الرفع السريع من الآيباد والجوال</p>
            <div class="upload-btn-text">اختيار ملف PDF ✨</div>
        </label>
        <input type="file" id="fileInput" accept=".pdf">

        <div class="progress-area" id="progressArea">
            <div class="progress-header">
                <span id="statusLabel">جاري معالجة الملف...</span>
                <span id="percentLabel">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="action-bar" id="actionBar">
            <button class="btn btn-download" onclick="downloadPDF()">✨ تحميل الملف المترجم (PDF)</button>
            <button class="btn btn-reset" onclick="resetPage()">🔄 اختيار ملف آخر</button>
        </div>

        <div class="preview-container" id="previewContainer">
            <div id="pdfContent">
                <div class="doc-title">مستند مترجم عبر منصة لينا 👑</div>
                <div id="pairsContainer"></div>
            </div>
        </div>
    </main>

    <footer>
        صُمم بكل حب وأناقة • منصة لينا للترجمة الذكية 🌸
    </footer>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const progressArea = document.getElementById('progressArea');
        const progressFill = document.getElementById('progressFill');
        const statusLabel = document.getElementById('statusLabel');
        const percentLabel = document.getElementById('percentLabel');
        const actionBar = document.getElementById('actionBar');
        const previewContainer = document.getElementById('previewContainer');
        const pairsContainer = document.getElementById('pairsContainer');

        let savedFileName = "Lina_Translated";

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        async function handleFile(file) {
            if (file.type !== "application/pdf") {
                alert("يرجى اختيار ملف بصيغة PDF صحيح.");
                return;
            }

            savedFileName = file.name.replace('.pdf', '') + "_لينا";
            dropZone.style.display = 'none';
            progressArea.style.display = 'block';
            pairsContainer.innerHTML = '';
            updateProgress(10, "جاري قراءة الملف...");

            const reader = new FileReader();
            reader.readAsArrayBuffer(file);

            reader.onload = async function() {
                try {
                    const typedarray = new Uint8Array(this.result);
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    let extractedLines = [];

                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        
                        textContent.items.forEach(item => {
                            let text = item.str.trim();
                            if (text.length > 2 && !extractedLines.includes(text)) {
                                extractedLines.push(text);
                            }
                        });
                    }

                    if (extractedLines.length === 0) {
                        updateProgress(0, "عذراً، لم يتم العثور على نصوص واضحة في الملف.");
                        return;
                    }

                    previewContainer.style.display = 'block';
                    let total = extractedLines.length;

                    for (let idx = 0; idx < total; idx++) {
                        let enText = extractedLines[idx];
                        let pct = Math.round(((idx + 1) / total) * 100);
                        updateProgress(pct, `جاري ترجمة السطر ${idx + 1} من ${total}...`);

                        let arText = await translateText(enText);

                        let box = document.createElement('div');
                        box.className = 'pair-box';
                        box.innerHTML = `
                            <div class="en-txt">${escapeHtml(enText)}</div>
                            <div class="ar-txt">${escapeHtml(arText)}</div>
                        `;
                        pairsContainer.appendChild(box);
                    }

                    updateProgress(100, "✨ تمت ترجمة الملف بنجاح تام!");
                    actionBar.style.display = 'flex';

                } catch (error) {
                    console.error(error);
                    updateProgress(0, "حدث خطأ أثناء معالجة الملف.");
                }
            };
        }

        function updateProgress(pct, msg) {
            progressFill.style.width = pct + '%';
            percentLabel.innerText = pct + '%';
            statusLabel.innerText = msg;
        }

        async function translateText(text) {
            try {
                let url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ar&dt=t&q=${encodeURIComponent(text)}`;
                let response = await fetch(url);
                let data = await response.json();
                return data[0].map(item => item[0]).join('');
            } catch {
                return "[تعذرت الترجمة]";
            }
        }

        function downloadPDF() {
            let element = document.getElementById('pdfContent');
            statusLabel.innerText = "جاري إعداد الملف للتحميل... 👑";

            let opt = {
                margin:       10,
                filename:     savedFileName + '.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                statusLabel.innerText = "✨ تم تحميل الملف بنجاح!";
            });
        }

        function resetPage() {
            fileInput.value = '';
            dropZone.style.display = 'flex';
            progressArea.style.display = 'none';
            actionBar.style.display = 'none';
            previewContainer.style.display = 'none';
            pairsContainer.innerHTML = '';
        }

        function escapeHtml(text) {
            return text.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }
    </script>
</body>
</html>
